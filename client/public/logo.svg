<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021f18" />
    </linearGradient>

    <!-- Spiritual Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Luminous Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Geometric Islamic Star Background Pattern -->
  <g opacity="0.12" stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="180" />
    <circle cx="256" cy="256" r="140" />
    <polygon points="256,76 383,183 383,329 256,436 129,329 129,183" />
    <polygon points="256,436 383,329 383,183 256,76 129,183 129,329" transform="rotate(45 256 256)" />
  </g>

  <!-- Luminous Crescent Moon (Hilal) -->
  <path d="M290 120 C200 120 130 190 130 280 C130 370 200 440 290 440 C320 440 350 430 375 415 C270 410 200 330 200 256 C200 182 270 102 375 97 C350 82 320 120 290 120 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)" />

  <!-- 8-Pointed Islamic Star (Rub el Hizb) -->
  <g transform="translate(345, 175) scale(0.65)" filter="url(#glow)">
    <rect x="-35" y="-35" width="70" height="70" fill="url(#goldGrad)" rx="6" />
    <rect x="-35" y="-35" width="70" height="70" fill="url(#goldGrad)" rx="6" transform="rotate(45)" />
    <circle cx="0" cy="0" r="14" fill="#022c22" />
    <circle cx="0" cy="0" r="8" fill="url(#emeraldGrad)" />
  </g>

  <!-- Central Elegant Sacred Dome / Arabic 'Meem' Accent -->
  <path d="M225 315 C225 270 256 240 256 240 C256 240 287 270 287 315 Z" fill="url(#emeraldGrad)" opacity="0.9" />
  <circle cx="256" cy="235" r="5" fill="url(#goldGrad)" />
</svg>
